#############################
### GENERAL & DECORATION ####
#############################
source = ~/.config/hypr/colors.conf


general {
    gaps_in = 5
    gaps_out = 9
    border_size = 2
    
    # Colores de borde
    col.active_border = $borde_activo_princ
    col.inactive_border = rgba(595959aa)
    
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 2
    active_opacity = 1.0 
    
    shadow {
        enabled = false
         range = 20
         render_power = 3
         color = rgba(0, 0, 0, 0.7)
         ignore_window = true
    }

    blur {
        enabled = true
        new_optimizations = true
        size = 3
        passes = 3
        contrast = 1
        vibrancy = 0.2
        vibrancy_darkness = 0.2
        ignore_opacity = true
    }
}

#############################
########## LAYOUTS ##########
#############################

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

#############################
########### MISC ############
#############################

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true
    vfr = true
}
