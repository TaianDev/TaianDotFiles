#####################
###### KEYBINDS #####
#####################
$mainMod = SUPER 


# --WINDOWS AND TERMINAL-- #
bind = $mainMod, Q, exec, $terminal
bind = $mainMod SHIFT, Q, exec, env IS_FLOATING=1 kitty --class kitty-floating
bind = $mainMod, C, killactive,
bind = $mainMod, V, exec, hyprctl dispatch togglefloating && hyprctl setprop active bordersize 3 && hyprctl setprop active rounding 4
bind = $mainMod SHIFT, V, exec, /home/taian/Personal_Scripts/complete_window_mode.sh
bind = $mainMod, F, fullscreen, toggle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bindm = $mainMod, mouse:272, movewindow

bind = $mainMod SHIFT, UP, resizeactive, 0 -20
bind = $mainMod SHIFT, DOWN, resizeactive, 0 20
bind = $mainMod SHIFT, LEFT, resizeactive, -20 0
bind = $mainMod SHIFT, RIGHT, resizeactive, 20 0
bindm = $mainMod SHIFT, mouse:272, resizewindow


# --WORKSPACES-- #
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, TAB, workspace, e+1
bind = $mainMod_Shift, TAB, workspace, e-1


# --SOUND AND BRIGHTNESS -- #
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86AudioPlay, exec, playerctl play-pause
bindel = ,XF86AudioNext, exec, playerctl next
bindel = ,XF86AudioPrev, exec, playerctl previous

bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness +5
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# -- SCREENSHOTS (HYPRSHOT)

# Complete
bind = , Print, exec, hyprshot -m output -o ~/Imágenes/Screenshots/All_display/  

# Region
bind = RSHIFT, Print, exec, hyprshot -m region -o ~/Imágenes/Screenshots/Regions/ 

# Focus
bind = , Print P, exec, hyprshot -m window -o ~/Imágenes/Screenshot/Windows/


# -- OTHER BINDS -- #
bind = $mainMod, M, exec, /home/taian/.config/wlogout/launcher.sh
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, X, hyprexpo:expo, toggle
bind = $mainMod, Z, exec, kitty --class clipse -e clipse
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod, L, exec, hyprlock

