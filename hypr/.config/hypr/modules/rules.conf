#############################
####### WINDOW RULES ########
#############################

# --- Sistema y Correcciones ---
# Ignorar eventos de maximización (Standard XWayland fix)
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Reparar "ghost windows" y errores de dibujado en XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# --- Ventanas Flotantes y Utilitarios ---
# Kitty Floating (Terminal flotante)
windowrule {
  name = windowrule-3
  float = on
  center = on
  size = 800 500
  match:class = ^(kitty-floating)$
}


# XDG Desktop Portal (Selectores de archivos, etc.)
windowrule {
  name = windowrule-4
  float = on
  match:class = ^(xdg-desktop-portal-gtk)$
}


# Clipse (Portapapeles)
windowrule {
  name = windowrule-5
  float = on
  stay_focused = on
  size = 495 450
  match:class = (clipse)
}


# --- Aplicaciones Específicas (Estética) ---
# Brave Browser
# Nota: Al aplicar esto a la clase general, ya cubre ventanas normales y popups/flotantes.
windowrule {
  name = windowrule-6
  no_blur = on
  no_shadow = on
  opaque = on
  match:class = ^(Brave-browser)$
}


# Tidal (Transparencia)
windowrule {
  name = windowrule-7
  opacity = 0.85
  match:class = (tidal-hifi)
}

# VS-CODE
#windowrule {
#  name = windowrule-8
#  opacity = 1
#  match:class = ^(code-url-handler)$
#}

windowrule {
  name = windowrule-9
  opacity = 1
  match:class = ^(code)$
}

############################
####### LAYER RULES ########
############################

# --- Rofi (Lanzador) ---
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  animation = popin
  match:namespace = rofi
}


# --- SwayNotificationCenter (Notificaciones) ---
# Panel de control
layerrule {
  name = layerrule-2
  blur = on
  ignore_alpha = 0.5
  animation = fade
  match:namespace = swaync-control-center
}


# Ventana de notificación emergente
layerrule {
  name = layerrule-3
  blur = on
  ignore_alpha = 0
  animation = slide left
  match:namespace = swaync-notification-window
}


# --- Waybar (Barra) ---
layerrule {
  name = layerrule-4
  animation = fade
  match:namespace = waybar
  blur = on
  ignore_alpha = 0
}


# --- SwayOSD (Volumen/Brillo en pantalla) ---
layerrule {
  name = layerrule-5
  animation = fade
  match:namespace = swayosd
}


# --- Diálogos de Sistema (Logout/Wlogout) ---
layerrule {
  name = layerrule-6
  blur = on
  ignore_alpha = 0
  animation = fade
  match:namespace = logout_dialog
}


# --- Herramientas de Selección (Slurp/Grim) ---
layerrule {
  name = layerrule-7
  blur = on
  ignore_alpha = 0
  match:namespace = signature
}

layerrule {
  name = layerrule-8
  animation = fade
  match:namespace = selection
}


# --- Popups Específicos de Brave ---
# Esto intenta aplicar blur a capas específicas que Brave pueda generar
layerrule {
  name = layerrule-9
  blur = on
  ignore_alpha = 0
  no_anim = on
  match:namespace = ^(Brave-browser)$
  match:namespace = popup
}

# -- Hyprwave -- 
layerrule {
    name = layerrule-10
    blur = on
    no_anim = on
    ignore_alpha = 0
    match:namespace = hyprwave
}


