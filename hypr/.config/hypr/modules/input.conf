###############################
####### TECLADO Y RATÓN #######
###############################

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0 #Por defecto
    touchpad {
        natural_scroll = false
    }
}

# Gesto nativo 1:1 para cambiar workspace (3 dedos horizontal)
gesture = 3, horizontal, workspace

# 4 dedos izquierda/derecha → cambiar workspace
gesture = 4, right, dispatcher, workspace e+1
gesture = 4, left, dispatcher, workspace e-1

# 3 dedos arriba/abajo → mover ventana a otro workspace
gesture = 3, down, dispatcher, movetoworkspace e+1
gesture = 3, up, dispatcher, movetoworkspace e-1

device {
    name = logitech-g203-lightsync-gaming-mouse
    sensitivity = 0.6
}

# Configuración para el teclado de la Laptop (Latinoamericano)
device {
    name = at-translated-set-2-keyboard
    kb_layout = latam
}

# Configuración para el teclado Físico/Inalámbrico (Inglés US)
device {
    name = compx-2.4g-wireless-receiver
    kb_layout = us
    kb_variant = 
    kb_options = compose:rctrl
}

# Teclado Físico Aula F75 (US con soporte para español)
device {
    name = by-tech-gaming-keyboard
    kb_layout = us
    kb_options = compose:rctrl
}
