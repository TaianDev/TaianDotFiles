## ~/.config/matugen/templates/hyprland-colors.conf

# --- Colores de Borde para Hyprland (Consistencia Waybar) ---

# Variable principal para el borde activo
# CORRECCIÓN: Usamos 'primary' (tu mb-primary) en vez de 'primary_fixed'.
# Esto iguala el color base de tus bordes en Waybar.
$borde_activo_princ = rgba(88d6bbff)

# Variable secundaria para dar un efecto de gradiente al activo
# OPCIÓN: Usamos 'secondary' para que el gradiente fluya entre tus dos acentos principales.
# (Si prefieres que sea monocolor, pon 'primary' aquí también).
$borde_activo_sec = rgba(b2ccc1ff)

# Variable para el borde inactivo
# CORRECCIÓN: Usamos 'surface_variant' (tu mb-surface-variant) para que las ventanas
# inactivas se vean del mismo material que tus módulos de la barra.
$borde_inactivo = rgba(3f4945ff)
