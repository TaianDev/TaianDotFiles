general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = false
}

background {
    monitor = 
    path = /home/taian/.config/hypr/current_wall
    blur_passes = 4
    blur_size = 3
    # Tinte suave (33 = ~20%)
    color = rgba(cae6ff33)
}

# --- INPUT FIELD ---
input-field {
    monitor =
    rounding = 8
    size = 280, 45
    outline_thickness = 4
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = 4
    
    # Borde SÓLIDO (ff = 100%)
    outer_color = rgba(cae6ffff)
    
    # Fondo TINTADO (33 = ~20%)
    inner_color = rgba(cae6ff33)
    
    # Texto (ff = 100%)
    font_color = rgba(e0e3e8ff)
    
    # Feedback funcional
    check_color = rgba(cae6ffff)
    fail_color = rgba(ffb4abff)
    capslock_color = rgba(b7c9d9ff)
    
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = -------------|  󰮯  󰮯  󰮯  󰮯  |-------------
    hide_input = false
    fail_text = NOUUUUUU! ($ATTEMPTS)
    
    position = 0, -200
    halign = center
    valign = center
    
    shadow_passes = 4
    shadow_size = 10
    # Sombra Glow (80 = ~50%)
    shadow_color = rgba(cae6ff80)
}

# --- HORA ---
label {
    monitor =
    text = cmd[update:500] echo "$(date +"%l:%M:%S %p")"
    color = rgba(cae6ffff)
    font_size = 75
    font_family = JetBrainsMono Nerd Font 
    position = 0, 220
    halign = center
    valign = center
    
    shadow_passes = 3
    shadow_size = 3
    # Sombra suave (4d = ~30%)
    shadow_color = rgba(cae6ff4d)
}

# --- FECHA ---
label {
    monitor =
    text = cmd[update:3600000] echo "$(date +"%A %d de %B del %Y")"
    color = rgba(e0e3e8ff)
    font_size = 23
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
    
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(cae6ff4d)
}

# --- AVATAR ---
image {
    monitor =
    rounding = 10
    path = /home/taian/Imágenes/Fondos/Avatares/gato.jpg
    size = 180
    border_size = 4
    
    # Borde SÓLIDO
    border_color = rgba(cae6ffff)
    
    position = 0, -8
    halign = center
    valign = center
    
    shadow_passes = 2
    shadow_size = 15
    # Resplandor fuerte (66 = ~40%)
    shadow_color = rgba(cae6ff66)
}

# --- BIENVENIDA ---
label {
    monitor =
    text = Bienvenido, $USER
    color = rgba(e0e3e8ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
    
    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(cae6ff33)
}

# --- STATUS WIDGETS ---

# Conexión
label {
    monitor =
    text = cmd[update:5000] if ping -c 1 8.8.8.8 >/dev/null 2>&1; then echo "  󰖩 Conectado"; else echo "󰖪 Sin conexión"; fi
    color = rgba(e0e3e8ff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 40, -11
    halign = rigth
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(cae6ff4d)
}

# Bluetooth
label {
    monitor =
    text = cmd[update:5000] if bluetoothctl info 2>/dev/null | grep -q "Connected: yes"; then echo "󰂱 Conectado"; else if bluetoothctl show | grep -q "Powered: yes"; then echo "󰂯 Encendido"; else echo "󰂲 Apagado"; fi; fi
    color = rgba(e0e3e8ff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = -340, -11
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(cae6ff4d)
}

# Batería
label {
    monitor =
    text = cmd[update:5000] status=$(cat /sys/class/power_supply/BAT0/status); if [ "$status" = "Charging" ] || [ "$status" = "Full" ]; then echo "󰂄 Conectado"; else echo "󰂃 Descargando"; fi
    color = rgba(e0e3e8ff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 550, -11
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(cae6ff4d)
}

# Uptime
label {
    monitor =
    text = cmd[update:60000] echo " $(uptime -p | sed 's/up / /' | sed 's/ days/d/' | sed 's/ day/d/' | sed 's/ hours/h/' | sed 's/ hour/h/' | sed 's/ minutes/m/' | sed 's/ minute/m/' | sed 's/,//g')"
    color = rgba(e0e3e8ff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 325, -11
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(cae6ff4d)
}

