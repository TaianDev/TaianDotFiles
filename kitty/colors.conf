## name: Matugen Material You (Yazi Fix)
## author: Generated for Hyprland Rice

/* --- 1. FONDO CONSISTENTE CON WAYBAR --- */
/* Pediste que fuera el mismo de la waybar. Waybar usa 'mb-background' 
   que mapea a 'surface', así que usamos ese aquí también. */
background            #111318
foreground            #e2e2e9

/* --- 2. SELECCIÓN DE TEXTO (Highlight) --- */
/* Usamos 'inverse_surface' para máximo contraste al seleccionar texto. */
selection_background  #e2e2e9
selection_foreground  #111318

/* --- 3. CURSOR --- */
cursor                #abc7ff
cursor_text_color     #0d2f5f

/* --- 4. BORDES Y URLS --- */
url_color             #ddbce0
active_border_color   #abc7ff
inactive_border_color #44474e
bell_border_color     #ffb4ab

/* --- 5. PESTAÑAS (TAB BAR) --- */
active_tab_foreground   #0d2f5f
active_tab_background   #abc7ff
active_tab_font_style   bold
inactive_tab_foreground #c4c6d0
inactive_tab_background #33353a

/* --- 6. COLORES ANSI (SOLUCIÓN YAZI) --- */
/* El problema de Yazi es que usa colores como fondo para el texto blanco.
   Si usamos colores pasteles, no se lee. 
   SOLUCIÓN: Usamos las variantes 'fixed_dim' para los colores principales.
   Son más oscuros y permiten leer texto blanco encima. */

/* Negro */
color0  #282a2f
color8  #8e9099

/* Rojo */
color1  #ffb4ab
color9  #93000a

/* Verde */
color2  #bec6dc
color10 #bec6dc

/* Amarillo */
color3  #ddbce0
color11 #ddbce0

/* Azul (Muy usado en Yazi para directorios/UI) - Usamos FIXED DIM */
color4  #abc7ff
color12 #abc7ff

/* Magenta */
color5  #bec6dc
color13 #3e4759

/* Cyan (Usado para la barra de estado en Yazi a veces) - Usamos FIXED DIM */
color6  #ddbce0
color14 #573e5b

/* Blanco */
color7  #e2e2e9
color15 #e2e2e9
