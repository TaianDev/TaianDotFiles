## name: Matugen Material You (Yazi Fix)
## author: Generated for Hyprland Rice

/* --- 1. FONDO CONSISTENTE CON WAYBAR --- */
/* Pediste que fuera el mismo de la waybar. Waybar usa 'mb-background' 
   que mapea a 'surface', así que usamos ese aquí también. */
background            {{colors.surface.default.hex}}
foreground            {{colors.on_surface.default.hex}}

/* --- 2. SELECCIÓN DE TEXTO (Highlight) --- */
/* Usamos 'inverse_surface' para máximo contraste al seleccionar texto. */
selection_background  {{colors.on_surface.default.hex}}
selection_foreground  {{colors.surface.default.hex}}

/* --- 3. CURSOR --- */
cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}

/* --- 4. BORDES Y URLS --- */
url_color             {{colors.tertiary.default.hex}}
active_border_color   {{colors.primary.default.hex}}
inactive_border_color {{colors.outline_variant.default.hex}}
bell_border_color     {{colors.error.default.hex}}

/* --- 5. PESTAÑAS (TAB BAR) --- */
active_tab_foreground   {{colors.on_primary.default.hex}}
active_tab_background   {{colors.primary.default.hex}}
active_tab_font_style   bold
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
inactive_tab_background {{colors.surface_container_highest.default.hex}}

/* --- 6. COLORES ANSI (SOLUCIÓN YAZI) --- */
/* El problema de Yazi es que usa colores como fondo para el texto blanco.
   Si usamos colores pasteles, no se lee. 
   SOLUCIÓN: Usamos las variantes 'fixed_dim' para los colores principales.
   Son más oscuros y permiten leer texto blanco encima. */

/* Negro */
color0  {{colors.surface_container_high.default.hex}}
color8  {{colors.outline.default.hex}}

/* Rojo */
color1  {{colors.error.default.hex}}
color9  {{colors.error_container.default.hex}}

/* Verde */
color2  {{colors.secondary_fixed_dim.default.hex}}
color10 {{colors.secondary.default.hex}}

/* Amarillo */
color3  {{colors.tertiary_fixed_dim.default.hex}}
color11 {{colors.tertiary.default.hex}}

/* Azul (Muy usado en Yazi para directorios/UI) - Usamos FIXED DIM */
color4  {{colors.primary_fixed_dim.default.hex}}
color12 {{colors.primary.default.hex}}

/* Magenta */
color5  {{colors.secondary_fixed_dim.default.hex}}
color13 {{colors.secondary_container.default.hex}}

/* Cyan (Usado para la barra de estado en Yazi a veces) - Usamos FIXED DIM */
color6  {{colors.tertiary_fixed_dim.default.hex}}
color14 {{colors.tertiary_container.default.hex}}

/* Blanco */
color7  {{colors.on_surface.default.hex}}
color15 {{colors.inverse_surface.default.hex}}
