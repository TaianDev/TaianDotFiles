# =================================================================
# KITTY GLASSMORPHIC THEME - MATUGEN TEMPLATE
# Diseño optimizado para transparencias y fondos con Blur
# =================================================================

# --- NÚCLEO (Fondo y Texto) ---
# El fondo base. En Kitty, usa 'background_opacity' en tu kitty.conf 
# para el efecto real de cristal. Aquí definimos el tinte.
background            #{{colors.surface.default.hex_stripped}}

# Texto principal. Usamos 'on_surface' para máximo contraste.
foreground            #{{colors.on_surface.default.hex_stripped}}

# --- CURSOR Y SELECCIÓN ---
# Cursor vibrante para que no se pierda.
cursor                #{{colors.primary.default.hex_stripped}}
cursor_text_color     #{{colors.on_primary.default.hex_stripped}}

# Selección suave (efecto resaltador).
selection_foreground  #{{colors.on_secondary.default.hex_stripped}}
selection_background  #{{colors.secondary_container.default.hex_stripped}}

# Borde activo (si usas bordes en Kitty).
active_border_color   #{{colors.primary.default.hex_stripped}}
inactive_border_color #{{colors.outline_variant.default.hex_stripped}}

# =================================================================
# PALETA DE 16 COLORES (ANSI)
# Estructura: 
#   Normal (0-7)   -> Variantes 'Fixed/Dim' (Sólidos y legibles)
#   Brillante (8-15) -> Variantes 'Inverse/Container' (Efecto Neón)
# =================================================================

# --- NEGROS (Base del cristal) ---
# Color 0: Gris superficie (Cristal ahumado oscuro)
color0  #{{colors.surface_container_high.default.hex_stripped}}
# Color 8: Gris texto (Etiquetas y comentarios visibles)
color8  #{{colors.on_surface_variant.default.hex_stripped}}

# --- ROJOS (Errores) ---
# Color 1: Rojo teja (Sólido)
color1  #{{colors.error.default.hex_stripped}}
# Color 9: Rojo coral/rosado (Brillante pero no agresivo)
color9  #{{colors.tertiary_fixed.default.hex_stripped}}

# --- VERDES (Éxito / Strings) ---
# Color 2: Verde azulado sólido
color2  #{{colors.secondary_fixed_dim.default.hex_stripped}}
# Color 10: Verde/Teal vibrante (El color 'Secundario' real)
color10 #{{colors.secondary.default.hex_stripped}}

# --- AMARILLOS (Advertencias) ---
# Color 3: Ocre/Ámbar
color3  #{{colors.tertiary_fixed_dim.default.hex_stripped}}
# Color 11: Amarillo/Naranja brillante
color11 #{{colors.on_tertiary_container.default.hex_stripped}}

# --- AZULES (Directorios / Info) ---
# Color 4: Azul mate
color4  #{{colors.primary_fixed.default.hex_stripped}}
# Color 12: Azul Cristal (El color 'Primario' real)
color12 #{{colors.primary.default.hex_stripped}}

# --- MAGENTAS (Acentos) ---
# Color 5: Violeta
color5  #{{colors.secondary_fixed.default.hex_stripped}}
# Color 13: Magenta/Rosa neón
color13 #{{colors.on_secondary_fixed.default.hex_stripped}}

# --- CYANS (Enlaces / Especiales) ---
# Color 6: Cyan apagado
color6  #{{colors.tertiary_fixed.default.hex_stripped}}
# Color 14: Cyan Eléctrico (Inverse Primary es el color más 'digital')
color14 #{{colors.inverse_primary.default.hex_stripped}}

# --- BLANCOS (Texto) ---
# Color 7: Gris claro (Outline)
color7  #{{colors.outline.default.hex_stripped}}
# Color 15: Blanco Puro (Máximo brillo)
color15 #{{colors.on_surface.default.hex_stripped}}
